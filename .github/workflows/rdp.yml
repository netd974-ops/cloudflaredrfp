name: Windows-RDP-Cloudflare
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Download Cloudflare Executable
      run: |
        # تحميل ملف الـ exe المباشر لتفادي ضياع المسارات
        Invoke-WebRequest https://github.com -OutFile cloudflared.exe
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel and Show Connection Link
      run: |
        # تشغيل النفق مباشرة من المجلد الحالي
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -NoNewWindow
        Start-Sleep -Seconds 12
        
        # استخراج رابط الاتصال من ملفات سجل النظام
        Get-Content -Path "$env:USERPROFILE\.cloudflared\*.log" -ErrorAction SilentlyContinue | Select-String -Pattern "trycloudflare.com"
        
        Write-Host "=========================================="
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }

