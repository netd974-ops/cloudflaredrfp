name: Windows-RDP-Cloudflare
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Download Cloudflare Direct Executable
      run: |
        # إنشاء مجلد ثابت لمنع اختفاء الملف
        mkdir C:\Cloudflared
        
        # تحميل الملف التنفيذي المباشر داخل المجلد الجديد
        Invoke-WebRequest -Uri "https://github.com" -OutFile "C:\Cloudflared\cloudflared.exe"
    - name: Enable RDP
      run: |
        # تفعيل منفذ الـ RDP داخل الويندوز
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel and Show Connection Link
      run: |
        # تشغيل النفق من المسار الثابت الذي قمنا بإنشائه
        Start-Process -FilePath "C:\Cloudflared\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -NoNewWindow
        Start-Sleep -Seconds 15
        
        # استخراج رابط الاتصال المجاني لمشاركة الإنترنت
        Get-Content -Path "$env:USERPROFILE\.cloudflared\*.log" -ErrorAction SilentlyContinue | Select-String -Pattern "trycloudflare.com"
        
        Write-Host "=========================================="
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }





