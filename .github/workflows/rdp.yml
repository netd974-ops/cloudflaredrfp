name: Windows-RDP-Cloudflare
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Install Cloudflare via Winget
      run: |
        # التثبيت المباشر والآمن عبر مدير حزم ويندوز الرسمي لجيتهاب
        winget install --id Cloudflare.cloudflared --silent --accept-source-agreements --accept-package-agreements
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel and Show Connection Link
      run: |
        # تشغيل النفق بعد التثبيت في مسار النظام الصحيح
        Start-Process -FilePath "C:\Program Files\cloudflared\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -NoNewWindow
        Start-Sleep -Seconds 15
        
        # استخراج رابط الاتصال المجاني والمباشر لمشاركة الإنترنت
        Get-Content -Path "$env:USERPROFILE\.cloudflared\*.log" -ErrorAction SilentlyContinue | Select-String -Pattern "trycloudflare.com"
        
        Write-Host "=========================================="
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }




