name: Windows-RDP-Direct
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Download and Run Cloudflare Tunnel
      run: |
        # تحميل النسخة المستقرة من خوادم كلاود فلير مباشرة باستخدام curl الذكي لضمان عدم التلف
        curl -L -o cloudflared.exe https://github.com
        
        # تشغيل النفق وتحويل المخرج لملف نصي لاستخراج الرابط
        Start-Process .\cloudflared.exe -ArgumentList "tunnel --url rdp://localhost:3389" -RedirectStandardOutput "tunnel.txt" -NoNewWindow
        
        Write-Host "Waiting for Cloudflare Link..."
        Start-Sleep -Seconds 20
        
        Write-Host "=========================================="
        Write-Host "YOUR RDP CONNECTION LINK IS BELOW:"
        # طباعة الرابط الذي تم توليده حصرياً لك
        Get-Content tunnel.txt | Select-String -Pattern "trycloudflare.com"
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }

