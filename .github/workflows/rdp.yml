name: Windows-RDP-Direct
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        # تفعيل خيارات الـ RDP داخل سيرفر ويندوز
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel and Force Show Link
      run: |
        # فتح نفق TCP نقي وعشوائي ليتوافق مع برنامج الـ RDP تماماً
        ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net > tunnel.txt 2>&1 &
        
        Write-Host "Waiting for Secure TCP Link..."
        Start-Sleep -Seconds 20
        
        Write-Host "=========================================="
        Write-Host "YOUR RDP CONNECTION DETAILS:"
        
        # طباعة الرابط والمنفذ المخصص لك
        Get-Content tunnel.txt
        
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }
