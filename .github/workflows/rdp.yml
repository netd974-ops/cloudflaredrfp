name: Windows-RDP-Direct
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel and Force Show Link
      run: |
        # تشغيل الاتصال وحفظ المخرج في ملف نصي لإظهار الرابط مجبراً
        Start-Process ssh -ArgumentList "-R 80:localhost:3389 nokey@localhost.run" -RedirectStandardOutput "tunnel.txt" -NoNewWindow
        
        Write-Host "Waiting for link generation..."
        Start-Sleep -Seconds 15
        
        Write-Host "=========================================="
        Write-Host "YOUR RDP CONNECTION LINK IS BELOW:"
        # طباعة محتوى الملف الذي يحتوي على الرابط
        Get-Content tunnel.txt | Select-String -Pattern "localhost.run"
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }




