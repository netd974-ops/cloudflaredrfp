name: Windows-RDP-Direct
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel and Force Show Link
      run: |
        # فتح اتصال نفق مباشر وحفظ الرابط بداخل ملف نصي
        ssh -o StrictHostKeyChecking=no -R 80:localhost:3389 nokey@localhost.run > tunnel.txt 2>&1 &
        
        Write-Host "Waiting for Secure Tunnel Link..."
        Start-Sleep -Seconds 15
        
        Write-Host "=========================================="
        Write-Host "YOUR RDP CONNECTION DETAILS:"
        
        # طباعة الرابط الذي تم إنشاؤه لك مجبراً
        Get-Content tunnel.txt
        
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }

