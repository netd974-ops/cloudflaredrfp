name: Windows-RDP-Direct
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel and Force Show Link
      run: |
        # تشغيل الاتصال عبر خدمة Serveo المضمونة وطباعة الرابط فوراً
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -R 80:localhost:3389 serveo.net" -RedirectStandardOutput "tunnel.txt" -NoNewWindow
        
        Write-Host "Waiting for Serveo link..."
        Start-Sleep -Seconds 15
        
        Write-Host "=========================================="
        Write-Host "YOUR RDP CONNECTION LINK IS BELOW:"
        # طباعة المحتوى بالكامل لرؤية الرابط مجبراً
        Get-Content tunnel.txt
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }



