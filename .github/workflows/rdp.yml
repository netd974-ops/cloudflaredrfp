name: Windows-RDP-Direct
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        # تفعيل الـ RDP داخل الويندوز والسماح بمرور الاتصال
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Create Tunnel via SSH LocalhostRun
      run: |
        # تشغيل اتصال نفق سريع ومباشر باستخدام أداة SSH المدمجة في الويندوز أساساً
        Start-Process ssh -ArgumentList "-R 80:localhost:3389 nokey@localhost.run" -NoNewWindow
        Start-Sleep -Seconds 10
        
        Write-Host "=========================================="
        Write-Host "للاتصال بالـ RDP: استخدم الرابط المكتوب في السجل بالأسفل"
        Write-Host "Username: runneradmin"
        Write-Host "Password: RdpPassword2026!"
        Write-Host "=========================================="
    - name: Keep RDP Alive
      run: |
        $seconds = 21600
        while ($seconds -gt 0) { Start-Sleep -Seconds 60; $seconds -= 60 }




